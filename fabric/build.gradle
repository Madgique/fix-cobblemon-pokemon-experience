plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Fabric Language Kotlin (required by Cobblemon)
    modImplementation "net.fabricmc:fabric-language-kotlin:$rootProject.fabric_kotlin_version"

    // Cobblemon (modImplementation comme les projets Architectury de reference)
    modImplementation("com.cobblemon:fabric:$rootProject.cobblemon_version")

    // Mod Menu
    modImplementation "com.terraformersmc:modmenu:$rootProject.mod_menu_version"

    // Radical Cobblemon Trainers + dependances (dev uniquement, pour tester les combats de dresseurs)
    modLocalRuntime "maven.modrinth:rctmod:$rootProject.rctmod_version"
    modLocalRuntime "maven.modrinth:rctapi:$rootProject.rctapi_version"
    modLocalRuntime "maven.modrinth:forge-config-api-port:$rootProject.forge_config_api_port_version"
    modLocalRuntime "maven.modrinth:architectury-api:$rootProject.architectury_api_version"

    // Jar-in-jar embarques par ces mods mais NON deplies par Loom en dev ->
    // il faut les declarer explicitement (cf. reference sur Refined Storage/Cardinal Components)
    runtimeOnly "com.electronwill.night-config:core:3.8.0"
    runtimeOnly "com.electronwill.night-config:toml:3.8.0"
    runtimeOnly "org.jgrapht:jgrapht-core:1.5.2"
    runtimeOnly "org.jgrapht:jgrapht-ext:1.5.2"
    runtimeOnly "org.jheaps:jheaps:0.14"
    runtimeOnly "org.apfloat:apfloat:1.15.0"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
